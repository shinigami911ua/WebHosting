<!DOCTYPE html>
<html lang="ru">

<head>
    <title>NIGER - Home</title>

    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">

    <link rel="stylesheet" href="style.css">

    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <meta charset="UTF-8">
</head>

<body>

    <!-- Retro effects -->
    <div class="retro_screen_glowing"></div>
    <div class="retro_console_effect"></div>
    <div class="retro_screen_border"></div>


    <!-- Main screen -->

        <!-- Language switch -->
        <div class="console_corner" id="langs">
            [
            <span id="RU" class="lang">RU</span>
            /
            <span id="EN" class="lang">EN</span>
            ]
        </div>


        <br>


        <div class="console_content">

            <!-- Main title -->
            <h1 id="title">I am NIGER</h1>

            <br>

            <!-- Subtitle -->
            <h3 id="bio">My Site</h3>

            <br>

            <div class="border"></div>

            <br>


            <!-- TWO COLUMNS -->
            <div class="section_block">


                <!-- =========================
                     LEFT COLUMN
                ========================== -->

                <div class="side_block">

                    <h3 id="about">About Me</h3>

                    <br>

                    <div class="about_entry">
                        <h5 id="skill1">
                            - Write me
                        </h5>
                    </div>

                    <div class="about_entry">
                        <h5 id="skill2">
                            - Our group
                        </h5>
                    </div>

                    <div class="about_entry">
                        <h5 id="skill3">
                            - Our channel
                        </h5>
                    </div>

                    <div class="about_entry">
                        <h5 id="skill4">
                            - Come in and take a look
                        </h5>
                    </div>

                    <a href="https://github.com/" target="_blank" rel="noopener noreferrer">
                        <div class="about_entry">
                            <h5 id="skill5">
                                - Projects on GitHub
                            </h5>
                        </div>
                    </a>

                </div>

                <!-- =========================
                     RIGHT COLUMN
                ========================== -->

                <div class="side_block">

                    <h3 id="contacts">Contacts</h3>

                    <br>


                    <!-- Telegram bot -->
                    <a href="https://t.me/YOUR_BOT"
                       target="_blank"
                       rel="noopener noreferrer">

                        <div class="about_entry">
                            <h3 id="telegramBot">
                                Telegram bot
                            </h3>
                        </div>

                    </a>


                    <!-- Telegram group -->
                    <a href="https://t.me/+FWxDIxt5Jm1lNjEx"
                       target="_blank"
                       rel="noopener noreferrer">

                        <div class="about_entry">
                            <h3 id="telegramGroup">
                                Telegram group
                            </h3>
                        </div>

                    </a>


                     <!-- Telegram channel -->
                    <a href="https://t.me/YOUR_CHANNEL"
                       target="_blank"
                       rel="noopener noreferrer">

                        <div class="about_entry">
                            <h3 id="telegramChannel">
                                Telegram channel
                            </h3>
                        </div>

                    </a>


                    <!-- YouTube -->
                    <a href="https://youtube.com/@niger228bb?si=eh6GhuOBr6Zkjv0U"
                       target="_blank"
                       rel="noopener noreferrer">

                        <div class="about_entry">
                            <h3 id="youtube">
                                YouTube
                            </h3>
                        </div>

                    </a>

                </div>

            </div>


            <br>

            <div class="border"></div>

            <br>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        /* =========================
           SOUND
        ========================== */

        const beep = new Audio("beep.mp3");


        /* =========================
           CURRENT LANGUAGE
        ========================== */

        let current_lang = getBrowserLang();


        /* =========================
           TRANSLATIONS
        ========================== */

        const locale = {

            RU: {

                title: "Я НИГЕР",

                bio: "Мой сайт",

                about: "Обо мне",

                contacts: "Контакты",

                skill1: "- Пишите мне",

                skill2: "- Наша группа",

                skill3: "- Наш канал",

                skill4: "- Заходи и посмотри",

                skill5: "- Наши проекты на GitHub",

                telegramBot: "Telegram бот",

                telegramGroup: "Telegram группа",

                telegramChannel: "Telegram канал",

                youtube: "YouTube"

            },


            EN: {

                title: "I am NIGER",

                bio: "My Site",

                about: "About Me",

                contacts: "Contacts",

                skill1: "- Write me",

                skill2: "- Our group",

                skill3: "- Our channel",
                
                skill4: "- Come in and take a look",

                skill5: "- Our projects on GitHub",

                telegramBot: "Telegram bot",

                telegramGroup: "Telegram group",

                telegramChannel: "Telegram channel",

                youtube: "YouTube"

            }

        };


        /* =========================
           PAGE LOAD
        ========================== */

        window.addEventListener("DOMContentLoaded", function () {

            updateLanguageInfo();

            typeText(
                "title",
                locale[current_lang].title,
                100
            );

        });


        /* =========================
           RUSSIAN
        ========================== */

        document.getElementById("RU").addEventListener("click", function () {

            current_lang = "RU";

            updateLanguageInfo();

            beep.currentTime = 0;

            beep.play().catch(function () {});

        });


        /* =========================
           ENGLISH
        ========================== */

        document.getElementById("EN").addEventListener("click", function () {

            current_lang = "EN";

            updateLanguageInfo();

            beep.currentTime = 0;

            beep.play().catch(function () {});

        });


        /* =========================
           UPDATE LANGUAGE
        ========================== */

        function updateLanguageInfo() {

            const new_lang = locale[current_lang];

            if (!new_lang) {
                return;
            }


            /* Active language */

            document.getElementById("RU").style.color =
                current_lang === "RU"
                    ? "#00EE20"
                    : "inherit";


            document.getElementById("EN").style.color =
                current_lang === "EN"
                    ? "#00EE20"
                    : "inherit";


            /* Update text */

            Object.keys(new_lang).forEach(function (id) {

                const element =
                    document.getElementById(id);

                if (element) {

                    element.textContent =
                        new_lang[id];

                }

            });


            /* Browser tab title */

            document.title =
                current_lang === "RU"
                    ? "НИГЕР - Главная"
                    : "NIGER - Home";


            /* HTML language */

            document.documentElement.lang =
                current_lang === "RU"
                    ? "ru"
                    : "en";

        }


        /* =========================
           TYPING EFFECT
        ========================== */

        async function typeText(
            id,
            text,
            interval = 100
        ) {

            const element =
                document.getElementById(id);

            if (!element) {
                return;
            }


            for (
                let i = 0;
                i <= text.length;
                i++
            ) {

                element.textContent =
                    text.substring(0, i);


                if (i < text.length) {

                    element.textContent += "|";

                }


                await sleep(interval);


                if (i < text.length) {

                    element.textContent =
                        text.substring(0, i);

                }

            }

        }


        /* =========================
           SLEEP
        ========================== */

        function sleep(ms) {

            return new Promise(function (resolve) {

                setTimeout(resolve, ms);

            });

        }


        /* =========================
           BROWSER LANGUAGE
        ========================== */

        function getBrowserLang() {

            const browserLang =
                navigator.language ||
                navigator.userLanguage ||
                "en";


            return /^ru/i.test(browserLang)
                ? "RU"
                : "EN";

        }

    </script>

</body>

</html>
